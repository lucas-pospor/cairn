[workspace]
resolver = "3"
members = ["crates/cairn-core", "crates/cairn-sync", "crates/cairn-server", "app/src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4

# Key derivation and hashing are unusably slow without optimizations.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
