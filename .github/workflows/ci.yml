name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # A fixed image rather than ubuntu-latest, which moves to 26.04 in
    # October-November 2026. 26.04 has a size-limited tmpfs /tmp, and many tests
    # write there, so the move to 26.04 is made on purpose after a trial run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build dependencies, plus gdb for the tests in
      # crates/cairn-sync/tests/adv_verify_sr_01.rs.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev gdb

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

      # Caches the cargo registry and the compiled dependencies in target/, keyed
      # on the Rust version and Cargo.lock. The workspace's own build output (the
      # debug test binaries alone are several GB) is rebuilt on every run anyway.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # One command on purpose: some cairn-sync tests run target/debug/cairn-server
      # and target/debug/examples/sync_dir, which this invocation builds.
      # --no-fail-fast reports every failing test binary, not just the first.
      - name: Test cairn-core, cairn-sync and cairn-server
        run: cargo test -p cairn-core -p cairn-sync -p cairn-server --no-fail-fast

      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Test the app crate
        run: cargo test -p cairn --lib

      # Warnings fail CI only; local builds and tests are not affected. A new
      # Rust release can bring new lints, which then need fixing here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type-check
        working-directory: app
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Unit tests
        working-directory: app
        run: npx vitest run

  # Builds and tests on Windows. svelte-check runs on Linux only: its result
  # does not depend on the platform. The installer is built in a job of its
  # own, which runs at the same time.
  windows:
    runs-on: windows-2025
    # The default shell, pwsh, fails a step only on the exit code of its last
    # command, so a step runs one command, or commands chained with &&.
    steps:
      # Before checkout, which honours these settings: keep the LF line endings
      # (git on the image converts them to CRLF) and allow paths longer than
      # 260 characters.
      - name: Configure git
        run: git config --global core.autocrlf false && git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Rust
        run: >-
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component clippy --no-self-update
          && rustup default stable-x86_64-pc-windows-msvc

      # The cache key includes the job id, so this cache is separate from the
      # Linux one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test cairn-core, cairn-sync and cairn-server
        run: cargo test -p cairn-core -p cairn-sync -p cairn-server --no-fail-fast

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the frontend
        working-directory: app
        run: npm run build

      - name: Test the app crate
        run: cargo test -p cairn --lib

      - name: Frontend unit tests
        working-directory: app
        run: npx vitest run

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Builds the Windows installer and keeps it for 7 days as an artifact of the
  # run, so that a release can attach the installer built from its own commit.
  # The installer is not signed.
  windows-installer:
    runs-on: windows-2025
    steps:
      # As in the windows job, one command or commands chained with && per step.
      - name: Configure git
        run: git config --global core.autocrlf false && git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Rust
        run: >-
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          && rustup default stable-x86_64-pc-windows-msvc

      # A cache of its own (release builds), as the job id is in the key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # tauri build runs npm run build first.
      - name: Build the NSIS installer
        working-directory: app
        run: npx tauri build --bundles nsis --ci

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
