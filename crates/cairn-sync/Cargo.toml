[package]
name = "cairn-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "End-to-end encrypted sync for Cairn notebooks: protocol, crypto, merge and client engine."

[features]
default = ["client"]
# The client engine (needs cairn-core and an HTTP client). The server only
# uses the protocol types.
client = ["dep:cairn-core", "dep:ureq", "dep:diffy", "dep:chacha20poly1305", "dep:argon2", "dep:blake3", "dep:parking_lot"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
base64 = "0.22"
cairn-core = { path = "../cairn-core", default-features = false, optional = true }
# Exact: the stall guard in transport.rs uses ureq's unversioned transport
# API, which can change in any release. Check it when upgrading.
ureq = { version = "=3.4.2", optional = true, features = ["json"] }
diffy = { version = "0.4", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
blake3 = { version = "1", optional = true }
parking_lot = { workspace = true, optional = true }
getrandom = "0.2"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
cairn-server = { path = "../cairn-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
parking_lot.workspace = true
